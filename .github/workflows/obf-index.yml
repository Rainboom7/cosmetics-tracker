name: OBF index

on:
  pull_request:
    paths:
      - ".github/workflows/obf-index.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Open Beauty Facts export
        run: |
          set -x
          UA="CosmeticsTracker-CI/1.0 (github.com/Rainboom7)"
          curl -sSIL -A "$UA" https://static.openbeautyfacts.org/data/en.openbeautyfacts.org.products.csv.gz | grep -i -E 'content-length|last-modified|HTTP/'
          curl -sSL -A "$UA" https://static.openbeautyfacts.org/data/en.openbeautyfacts.org.products.csv.gz -o obf.csv.gz
          ls -la obf.csv.gz
          zcat obf.csv.gz | head -1 | tr '\t' '\n' | nl | tr '\n' ' '
          echo
          zcat obf.csv.gz | wc -l
          zcat obf.csv.gz | sed -n '2,4p' | cut -c1-2500
          zcat obf.csv.gz | awk -F'\t' 'NR==1{for(i=1;i<=NF;i++) h[$i]=i; next} {n++; if($h["image_url"]!="") img++; if($h["product_name"]!="") nm++; c=$h["countries_tags"]; if(c ~ /russia/) ru++} END{print "rows",n,"with_image",img,"with_name",nm,"russia",ru}'
          curl -sS -A "$UA" "https://world.openbeautyfacts.org/api/v2/product/3600523614790.json" | head -c 6000
          echo
          curl -sS -A "$UA" "https://world.openbeautyfacts.org/api/v2/product/4005808890590.json?fields=code,product_name,generic_name,generic_name_ru,categories,labels,packaging,origins,manufacturing_places,periods_after_opening,countries,stores,emb_codes,link,ingredients_text,ingredients_text_ru,brands,quantity,product_name_ru,lang,languages_codes,unique_scans_n,popularity_key,completeness"
